name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -v
      - run: patch-scope-guard examples/input.json
      - run: patch-scope-guard --repo . --base HEAD --head HEAD --policy examples/policy.json --check
      - name: Verify policy finding exit status
        shell: bash
        run: |
          if patch-scope-guard examples/input.json --check; then
            echo "Expected a policy violation"
            exit 1
          else
            result=$?
            test "$result" -eq 1
          fi
